<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kfs80 | App & Project Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --vercel: #ffffff;
      --gh-pages: #22c55e;
      --private: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="search"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      min-width: 220px;
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
    }

    button.refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    button.refresh-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .badge.vercel { color: var(--vercel); background: rgba(255,255,255,0.08); }
    .badge.gh { color: var(--gh-pages); background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); }
    .badge.private { color: var(--private); background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }

    .card-desc {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding-top: 0.75rem;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
    }

    .repo-link {
      color: var(--accent);
      text-decoration: none;
    }

    .repo-link:hover {
      text-decoration: underline;
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>kfs80 Project Hub</h1>
        <p class="subtitle">Live Vercel &amp; GitHub Pages deployments</p>
      </div>
      <div class="controls">
        <input type="search" id="search" placeholder="Filter apps..." autocomplete="off" />
        <button class="refresh-btn" id="refreshBtn" title="Force refresh from GitHub">↻ Sync</button>
      </div>
    </header>

    <div id="status" class="status">Loading deployments...</div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const USERNAME = "kfs80";
    const CACHE_KEY = "kfs80_hub_repos_v1";
    const CACHE_TTL_MS = 10 * 60 * 1000; // 10 minutes

    // Add any private repos or standalone Vercel URLs here
    const PRIVATE_PROJECTS = [
      {
        name: "Family TV Dashboard",
        description: "Google Photos slideshow with personal & Hawkeye/Cyclone sports calendars.",
        homepage: "https://family-dashboard-three-xi.vercel.app",
        repoUrl: "https://github.com/kfs80",
        updatedAt: new Date().toISOString(),
        isPrivate: true
      }
    ];

    const gridEl = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refreshBtn");

    let allProjects = [];

    function formatTitle(slug) {
      return slug
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function getHostBadge(url, isPrivate) {
      if (isPrivate) return { label: "Private", cls: "private" };
      if (url.includes("vercel.app")) return { label: "Vercel", cls: "vercel" };
      if (url.includes("github.io")) return { label: "GitHub Pages", cls: "gh" };
      return { label: "Live App", cls: "gh" };
    }

    function render(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const filtered = allProjects.filter(
        (p) =>
          p.name.toLowerCase().includes(q) ||
          (p.description && p.description.toLowerCase().includes(q)) ||
          p.homepage.toLowerCase().includes(q)
      );

      gridEl.innerHTML = "";

      if (filtered.length === 0) {
        statusEl.style.display = "block";
        statusEl.textContent = q
          ? `No apps matching "${filterText}".`
          : "No deployed projects found. Add a Website URL to a repo's About section on GitHub to show it here.";
        return;
      }

      statusEl.style.display = "none";

      filtered.forEach((proj) => {
        const badge = getHostBadge(proj.homepage, proj.isPrivate);
        const dateStr = new Date(proj.updatedAt).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });

        const card = document.createElement("a");
        card.className = "card";
        card.href = proj.homepage;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="card-title">${proj.name}</div>
              <span class="badge ${badge.cls}">${badge.label}</span>
            </div>
            <p class="card-desc">${proj.description || "No description provided."}</p>
          </div>
          <div class="card-footer">
            <span>Updated ${dateStr}</span>
            <span class="repo-link" onclick="event.stopPropagation(); window.open('${proj.repoUrl}', '_blank');">Source ↗</span>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    async function loadProjects(forceRefresh = false) {
      statusEl.style.display = "block";
      statusEl.textContent = "Loading deployments...";

      try {
        let publicRepos = null;

        if (!forceRefresh) {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.timestamp < CACHE_TTL_MS) {
              publicRepos = parsed.data;
            }
          }
        }

        if (!publicRepos) {
          const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
          if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
          const raw = await res.json();

          publicRepos = raw
            .filter((r) => !r.fork && r.homepage && r.homepage.trim() !== "" && r.name.toLowerCase() !== `${USERNAME}.github.io`)
            .map((r) => ({
              name: formatTitle(r.name),
              description: r.description,
              homepage: r.homepage.startsWith("http") ? r.homepage.trim() : `https://${r.homepage.trim()}`,
              repoUrl: r.html_url,
              updatedAt: r.pushed_at || r.updated_at,
              isPrivate: false
            }));

          localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: publicRepos }));
        }

        allProjects = [...PRIVATE_PROJECTS, ...publicRepos];
        render(searchEl.value);
      } catch (err) {
        console.error(err);
        allProjects = [...PRIVATE_PROJECTS];
        render(searchEl.value);
      }
    }

    searchEl.addEventListener("input", (e) => render(e.target.value));
    refreshBtn.addEventListener("click", () => loadProjects(true));

    
    loadProjects();
  </script>
</body>
</html>
